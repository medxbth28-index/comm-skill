<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee4">
<title>al_witify — MCQ Revision</title>
<meta name="description" content="Interactive MCQ revision — Communication Skills — by al_witify">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2eee4; --card:#fbf9f3; --ink:#141414; --mute:#6f6a5f;
  --ok:#1e9e55; --bad:#d9302c;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --ui:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --wob:255px 14px 225px 14px / 14px 225px 14px 255px;
  --wob2:14px 225px 14px 255px / 255px 14px 225px 14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--ui);
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(ellipse at 50% 100%,rgba(120,100,60,.10),transparent 55%),
    var(--paper);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.38'/></svg>");
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
#app{position:relative;z-index:1}
.view{display:none}
.view.on{display:block;animation:enter .35s ease both}
.view.home.on{display:flex}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
.home{min-height:100vh;flex-direction:column;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.brand{margin-top:clamp(24px,9vh,80px);text-align:center;user-select:none}
.brand h1{
  margin:0;font-family:var(--hand);font-weight:700;line-height:.95;letter-spacing:1px;
  font-size:clamp(76px,26vw,150px);transform:rotate(-3deg);
}
.brand svg{width:min(78%,340px);height:auto;margin-top:-6px;overflow:visible}
.brand path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{margin:14px 0 0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.levels{width:100%;max-width:440px;margin-top:clamp(28px,7vh,56px);display:grid;gap:18px}
.lv{
  display:flex;align-items:center;gap:16px;width:100%;text-align:start;
  padding:16px 18px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);
  box-shadow:4px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s;
}
.lv:nth-child(even){border-radius:var(--wob2)}
.lv:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.lv .big{font-family:var(--hand);font-weight:700;font-size:54px;line-height:1;min-width:64px;text-align:center}
.lv .info{flex:1;min-width:0}
.lv .name{font-weight:700;font-size:15px;line-height:1.35}
.lv .state{font-size:12.5px;color:var(--mute);margin-top:2px;direction:rtl;text-align:left}
.mini{height:6px;margin-top:9px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:transparent}
.mini i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s}
.toggles{margin-top:auto;padding-top:34px;display:flex;gap:12px}
.tg{font-size:13px;padding:6px 14px;border:1.5px solid var(--ink);border-radius:var(--wob);background:var(--card);font-weight:600}
.tg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.sign{margin-top:16px;font-family:var(--hand);font-size:22px;color:var(--mute)}

/* ---------- Quiz ---------- */
.bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:max(8px,env(safe-area-inset-top)) 14px 8px;
  background:rgba(242,238,228,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-bottom:2px solid var(--ink);
}
.back{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:var(--wob);background:var(--card);font-size:19px;line-height:1;flex:none}
.back:active{transform:scale(.92)}
.track{flex:1;height:9px;border:1.8px solid var(--ink);border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,#141414 0 3px,#3c3c3c 3px 5px);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.count{font-family:var(--hand);font-weight:700;font-size:21px;min-width:50px;text-align:right;flex:none}

.feed{max-width:640px;margin:0 auto;padding:18px 14px max(60px,env(safe-area-inset-bottom))}
.sec{font-family:var(--hand);font-weight:700;font-size:30px;margin:26px 4px 6px;position:relative;display:inline-block}
.sec::after{content:"";position:absolute;left:0;right:-8px;bottom:2px;height:4px;background:var(--ink);border-radius:4px;transform:rotate(-.8deg);opacity:.85}
.card{
  margin-top:16px;padding:18px 16px 16px;background:var(--card);
  border:2.5px solid var(--ink);border-radius:var(--wob);
  box-shadow:3px 4px 0 rgba(20,20,20,.9);
}
.card:nth-of-type(even){border-radius:var(--wob2)}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);margin-bottom:8px;direction:ltr}
.qmeta b{font-family:var(--hand);font-size:22px;color:var(--ink);line-height:1}
.qtext{font-weight:700;font-size:17px;line-height:1.55;margin:0 0 6px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;
  padding:11px 13px;border:2px solid var(--ink);border-radius:var(--wob);background:rgba(255,255,255,.55);
  font-size:15.5px;line-height:1.5;transition:transform .1s,border-color .2s,background .2s,opacity .25s;
}
.opt:nth-child(even){border-radius:var(--wob2)}
.opt:not(.locked):active{transform:scale(.985);background:#fff}
.opt .bd{
  flex:none;width:28px;height:28px;display:grid;place-items:center;border:1.8px solid currentColor;border-radius:50%;
  font-family:var(--hand);font-weight:700;font-size:20px;line-height:1;margin-top:1px;transition:all .2s;
}
.opt.locked{cursor:default}
.opt.locked:not(.correct):not(.wrong){opacity:.5}
.opt.correct{border-color:var(--ok);border-width:3px;background:rgba(30,158,85,.09);padding:10px 12px}
.opt.correct .bd{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);border-width:3px;background:rgba(217,48,44,.08);padding:10px 12px}
.opt.wrong .bd{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.opt.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.ex.open{grid-template-rows:1fr}
.ex>div{overflow:hidden}
.exb{margin-top:14px;padding-top:12px;border-top:2px dashed var(--ink);direction:rtl;text-align:right;font-size:15.5px;line-height:1.95}
.exb .ans{font-weight:700;margin-bottom:2px}
.exb .ans span{font-family:var(--hand);font-size:24px;padding:0 6px;border:2px solid var(--ok);border-radius:var(--wob);color:var(--ok);margin-inline-start:4px}
.exb .lbl{font-weight:700}

.end{margin:34px 0 0;text-align:center;padding:26px 16px;border:2.5px dashed var(--ink);border-radius:var(--wob)}
.end h3{margin:0 0 4px;font-family:var(--hand);font-size:42px;line-height:1}
.end p{margin:0 0 16px;color:var(--mute);font-size:14px;direction:rtl}
.end .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:8px 20px;font-weight:700;font-size:15px;background:var(--card);border:2px solid var(--ink);border-radius:var(--wob);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}

/* ---------- Hearts ---------- */
.heart{position:fixed;z-index:999;pointer-events:none;line-height:1;will-change:transform,opacity;
  filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.brand path{animation:none;stroke-dashoffset:0}}
</style>
</head>

    <div class="brand">

<script>
const LEVELS = [{"id": "L1", "title": "Communication Skills 1", "questions": [{"s": "Communication Basics", "q": "Communication is best defined as:", "o": ["The transfer of medicines between hospitals", "The art of transmitting information, ideas, and attitudes from one person to another", "A process limited to written instructions", "A one-way exchange without meaning"], "a": 1, "e": "التواصل هو نقل المعلومات والأفكار والمواقف بين الأشخاص، مو بس الكلام أو الكتابة."}, {"s": "Communication Basics", "q": "Communication involves:", "o": ["Meaningful interaction among human beings", "Only speaking to patients", "Only electronic messages", "Only receiving instructions"], "a": 0, "e": "المحاضرة تركز على التفاعل الهادف بين البشر."}, {"s": "Communication Basics", "q": "Which of the following can be communicated according to the definition?", "o": ["Information only", "Ideas only", "Attitudes only", "Information, ideas, and attitudes"], "a": 3, "e": "التعريف يذكر الثلاثة: المعلومات والأفكار والمواقف."}, {"s": "Therapeutic Communication", "q": "Therapeutic communication occurs mainly between:", "o": ["Two computers", "A healthcare professional and a patient (and possibly the family)", "Hospital managers only", "A patient and a pharmacy inventory system"], "a": 1, "e": "هو تواصل بين مقدم الرعاية والمريض، وممكن يشمل عائلة المريض."}, {"s": "Therapeutic Communication", "q": "Which is a goal of therapeutic communication?", "o": ["Reducing patient trust", "Enhancing patient comfort, safety, trust, and well-being", "Avoiding patient questions", "Replacing all medical examinations"], "a": 1, "e": "هدفه يحسّن راحة المريض وأمانه وثقته وصحته."}, {"s": "Therapeutic Communication", "q": "One main purpose of therapeutic communication is to:", "o": ["Collect healthcare information about the patient", "Prevent the patient from speaking", "Increase distractions", "Ignore patient behavior"], "a": 0, "e": "أول غرض هو جمع المعلومات الصحية عن المريض."}, {"s": "Therapeutic Communication", "q": "Providing healthcare-related education and training is an example of:", "o": ["Noise", "Feedback as a purpose of therapeutic communication", "Decoding failure", "Inappropriate medium"], "a": 1, "e": "من الأغراض الثلاثة تقديم معلومات صحية وتثقيف وتدريب للمريض."}, {"s": "Therapeutic Communication", "q": "A third purpose of therapeutic communication is to:", "o": ["Assess and, when appropriate, modify patient behavior", "Avoid assessing behavior", "Communicate only with family", "Use symbols without meaning"], "a": 0, "e": "الغرض الثالث تقييم سلوك المريض وتعديله إذا كان مناسب."}, {"s": "Therapeutic Communication", "q": "Which is NOT one of the three stated purposes of therapeutic communication?", "o": ["Collect patient information", "Provide healthcare education", "Assess patient behavior", "Eliminate the need for all treatment"], "a": 3, "e": "المحاضرة ذكرت جمع المعلومات والتثقيف وتقييم السلوك؛ ما قالت يلغي العلاج."}, {"s": "Sender & Encoding", "q": "The sender is the person, group, or organization that:", "o": ["Interprets the message only", "Initiates communication", "Always provides feedback", "Blocks the message"], "a": 1, "e": "الـ Sender هو اللي يبدأ عملية التواصل."}, {"s": "Sender & Encoding", "q": "Which factor can influence the sender’s message?", "o": ["Culture", "Knowledge", "Attitudes", "All of the above"], "a": 3, "e": "ثقافة وخبرة ومعرفة ومواقف المرسل كلها تؤثر على الرسالة."}, {"s": "Sender & Encoding", "q": "Encoding means:", "o": ["Interpreting an incoming message", "Translating information or ideas into an understandable message", "Removing the receiver", "Confirming feedback"], "a": 1, "e": "الـ Encoding يعني تحويل الفكرة أو المعلومة إلى رسالة مفهومة."}, {"s": "Sender & Encoding", "q": "Which can be used to encode a message?", "o": ["Words", "Gestures", "Images and symbols", "All of the above"], "a": 3, "e": "الترميز ممكن يصير بكلمات أو إشارات أو صور أو رموز."}, {"s": "Sender & Encoding", "q": "In the communication process, encoding is performed to:", "o": ["Make the message impossible to understand", "Prepare ideas in a form the recipient can understand", "Avoid selecting a channel", "Replace the receiver"], "a": 1, "e": "الهدف صياغة الأفكار بشكل يفهمه المستلم."}, {"s": "Transmission & Decoding", "q": "A channel is needed to:", "o": ["Transmit a message", "Create physical pain", "Prevent feedback", "Change the sender’s culture"], "a": 0, "e": "الـ Channel هو الوسيلة اللي تنتقل من خلالها الرسالة."}, {"s": "Transmission & Decoding", "q": "According to the lecture, which communication method is perhaps still the most effective?", "o": ["Face-to-face communication", "Unaddressed letters", "Silent messages only", "No communication"], "a": 0, "e": "المحاضرة تعتبر التواصل وجهاً لوجه ربما الأكثر فعالية."}, {"s": "Transmission & Decoding", "q": "In the digital age, increasing numbers of messages are transmitted using:", "o": ["Only gestures", "The Internet", "Only printed books", "Only face-to-face meetings"], "a": 1, "e": "المحاضرة تشير لزيادة استخدام الإنترنت بنقل الرسائل."}, {"s": "Transmission & Decoding", "q": "Ideally, the transmission medium should be:", "o": ["The most expensive option", "The one most comfortable to the receiver", "Chosen without considering the receiver", "Always written"], "a": 1, "e": "الأفضل تختار الوسيلة اللي يرتاح إلها المستلم."}, {"s": "Transmission & Decoding", "q": "Decoding refers to:", "o": ["The sender initiating communication", "The receiver processing or interpreting a transmitted message", "Selecting the sender’s culture", "Removing the channel"], "a": 1, "e": "الـ Decoding يعني المستلم يفسر الرسالة ويفهم معناها."}, {"s": "Receiver & Feedback", "q": "Successful communication occurs when:", "o": ["The sender speaks loudly", "The receiver correctly interprets the sender’s message", "No feedback is possible", "A message is transmitted without meaning"], "a": 1, "e": "النجاح يعتمد على فهم المستلم للرسالة بصورة صحيحة."}, {"s": "Receiver & Feedback", "q": "The receiver is:", "o": ["The individual who always starts communication", "The person or group to whom the message is directed", "The communication channel", "Any physical distraction"], "a": 1, "e": "الـ Receiver هو الشخص أو المجموعة الموجّهة إلهم الرسالة."}, {"s": "Receiver & Feedback", "q": "Which influences the receiver’s comprehension?", "o": ["Knowledge of the topic", "Receptivity to the message", "Trust between sender and receiver", "All of the above"], "a": 3, "e": "الفهم يتأثر بمعرفة المستلم واستعداده والثقة والعلاقة بين الطرفين."}, {"s": "Receiver & Feedback", "q": "A receiver who knows little about the topic may have difficulty because of:", "o": ["Topic knowledge level", "The sender’s job title alone", "The color of the room only", "The number of hospitals nearby"], "a": 0, "e": "قلة المعرفة بالموضوع ممكن تصعّب فهم الرسالة."}, {"s": "Receiver & Feedback", "q": "Feedback primarily:", "o": ["Closes the loop of the communication cycle", "Always starts the message", "Replaces encoding", "Prevents understanding"], "a": 0, "e": "الـ Feedback يكمل دورة التواصل ويرجع تأكيد للمرسل."}, {"s": "Receiver & Feedback", "q": "Without feedback, the sender cannot confirm that:", "o": ["The message was correctly interpreted", "The channel exists", "The sender has an idea", "Words can be used"], "a": 0, "e": "بدون رد من المستلم ما يگدر المرسل يتأكد من الفهم الصحيح."}, {"s": "Receiver & Feedback", "q": "Which is the most appropriate example of feedback?", "o": ["The patient indicates understanding after an explanation", "The clinician leaves without checking", "A loud noise interrupts the discussion", "The patient never receives the message"], "a": 0, "e": "لما المريض يبيّن أنه فهم، هذا Feedback واضح."}, {"s": "Communication Barriers", "q": "Which of the following is a barrier to communication?", "o": ["Noise", "Poor listening skills", "Language differences", "All of the above"], "a": 3, "e": "كل هاي مذكورة ضمن معوقات التواصل."}, {"s": "Communication Barriers", "q": "Choosing a communication method that ack", "Strong mutual trust"], "a": 0, "e": "ضعف السمع أو البصر ممكن يعيق استقبال الرسالة، ولهذا يعد Noise."}]}, {"id": "L2", "title": "Nonverbal Communication 2", "questions": [{"s": "Fundamentals", "q": "Nonverbal communication enhances the expression of ideas mainly through:", "o": ["Only written words", "Body language, gestures, facial expressions and tone of voice", "Laboratory investigations", "Medical prescriptions"], "a": 1, "e": "التواصل غير اللفظي يوصل الفكرة عن طريق حركات الجسم والتعابير ونبرة الصوت، مو بس الكلام."}, {"s": "Fundamentals", "q": "Which of the following is also included in the lecture definition of nonverbal communication?", "o": ["Pictures, icons and symbols", "Blood pressure readings only", "Spoken sentences only", "Written diagnoses only"], "a": 0, "e": "الملزمة تذكر الصور والأيقونات والرموز كوسائل غير لفظية."}, {"s": "Fundamentals", "q": "Nonverbal body language may be:", "o": ["Always intentional", "Always unintentional", "Both intentional and unintentional", "Only verbal"], "a": 2, "e": "الحركات ممكن تكون مقصودة أو تطلع بدون قصد."}, {"s": "Fundamentals", "q": "Communication between an HCP and a patient can begin:", "o": ["Only after introducing themselves", "Before either person speaks", "Only after taking history", "Only after examination"], "a": 1, "e": "الطبيب والمريض يلاحظون لغة جسم بعض حتى قبل الكلام."}, {"s": "Fundamentals", "q": "A seriously ill patient’s nonverbal behavior may reveal:", "o": ["Fear, anxiety, confusion or anger", "Only blood glucose level", "Only age", "Only diagnosis"], "a": 0, "e": "تعابير وحركات المريض قد تبين خوفه أو قلقه أو ارتباكه أو غضبه."}, {"s": "Fundamentals", "q": "The most effective HCPs have nonverbal messages that:", "o": ["Contradict verbal messages", "Match verbal messages", "Replace all verbal messages", "Are ignored"], "a": 1, "e": "الأفضل لغة الجسم توافق الكلام حتى ما يصير تناقض بالرسالة."}, {"s": "Fundamentals", "q": "One importance of nonverbal communication is that it:", "o": ["Always remove   if (!ac()) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter(); filt.type = type; filt.frequency.value = freq; filt.Q.value = 1.2;
  const g = actx.createGain();
  g.gain.setValueAtTime(gainVal, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  src.connect(filt); filt.connect(g); g.connect(actx.destination); src.start();
}
function tick(freq = 880, dur = 0.07){
  if (!ac()) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.08, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}
function playClick(){ scratch(0.07, 1800, 0.14); }
function playCorrect(){ scratch(0.08, 1600, 0.16); setTimeout(() => { scratch(0.07, 2200, 0.13); tick(880, 0.08); }, 70); }
function playWrong(){ scratch(0.14, 500, 0.16); setTimeout(() => scratch(0.08, 380, 0.12), 60); }
function sfx(kind){ ({ tap:playClick, correct:playCorrect, wrong:playWrong })[kind](); }
function vib(p){ if (store.settings.vibe && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

/* ---------- Hearts ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function hearts(x, y){
  const n = reduced ? 3 : 6 + Math.floor(Math.random()*6);
  for (let i = 0; i < n; i++){
    const el = document.createElement('span');
    el.className = 'heart';
    el.textContent = Math.random() < .5 ? '🤍' : '🖤';
    const size = 10 + Math.random()*12;
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px`;
    document.body.appendChild(el);
    const dx = (Math.random()-.5)*130, dy = -(25 + Math.random()*95);
    const rot = (Math.random()-.5)*90, dur = 650 + Math.random()*750;
    const a = el.animate([
      { transform:'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity:0 },
      { transform:`translate(calc(-50% + ${dx*.35}px),calc(-50% + ${dy*.6}px)) scale(1.1) rotate(${rot*.4}deg)`, opacity:1, offset:.28 },
      { transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy + 30}px)) scale(.7) rotate(${rot}deg)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.2,.7,.3,1)', delay:Math.random()*90 });
    a.onfinish = () => el.remove();
  }
}

/* Tap detection: scrolling never triggers sound / hearts */
let pd = null;
addEventListener('pointerdown', e => { pd = { x:e.clientX, y:e.clientY, t:performance.now() }; }, { passive:true });
addEventListener('pointercancel', () => { pd = null; }, { passive:true });
addEventListener('pointerup', e => {
  if (!pd) return;
  const moved = Math.hypot(e.clientX-pd.x, e.clientY-pd.y), dt = performance.now()-pd.t;
  pd = null;
  if (moved > 12 || dt > 600) return;
  hearts(e.clientX, e.clientY);
  const live = e.target.closest && e.target.closest('.opt:not(.locked)');
  if (!live){ sfx('tap'); vib(8); }
}, { passive:true });

/* ---------- Home ---------- */
function renderHome(){
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach(L => {
    const done = Object.keys(answersOf(L.id)).length, total = L.questions.length;
    const st = done === 0 ? 'ابدأ' : done >= total ? 'تم ✓' : 'تابع — ' + done + ' / ' + total;
    const b = document.createElement('button');
    b.className = 'lv';
    b.innerHTML = `<span class="big">${L.id}</span>
      <span class="info"><div class="name">${L.title}</div><div class="state">${st}</div>
      <div class="mini"><i style="width:${done/total*100}%"></i></div></span>`;
    b.onclick = () => go(L.id);
    box.appendChild(b);
  });
  $('#tgSound').setAttribute('aria-pressed', store.settings.sound);
  $('#tgVibe').setAttribute('aria-pressed', store.settings.vibe);
}
$('#tgSound').onclick = e => { store.settings.sound = !store.settings.sound; save(); e.currentTarget.setAttribute('aria-pressed', store.settings.sound); };
$('#tgVibe').onclick  = e => { store.settings.vibe  = !store.settings.vibe;  save(); e.currentTarget.setAttribute('aria-pressed', store.settings.vibe); };

/* ---------- Quiz ---------- */
let cur = null;
const LET = ['A','B','C','D'];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function updateBar(){
  const total = cur.questions.length, done = Object.keys(answersOf(cur.id)).length;
  $('#fill').style.width = (done/total*100) + '%';
  $('#count').textContent = done + '/' + total;
  $('.track').setAttribute('aria-valuenow', done);
  $('.track').setAttribute('aria-valuemax', total);
}

function paint(card, q, chosen){
  const opts = card.querySelectorAll('.opt');
  opts.forEach((o, i) => {
    o.classList.add('locked');
    o.classList.toggle('correct', i === q.a);
    o.classList.toggle('wrong', i === chosen && i !== q.a);
    const bd = o.querySelector('.bd');
    bd.textContent = i === q.a ? '✓' : (i === chosen ? '✕' : LET[i]);
  });
  card.querySelector('.ex').classList.add('open');
}

function renderQuiz(L){
  cur = L;
  const feed = $('#feed'); feed.innerHTML = '';
  const ans = answersOf(L.id), total = L.questions.length;
  let lastSec = null, firstOpen = null;
  L.questions.forEach((q, qi) => {
    if (q.s && q.s !== lastSec){
      const h = document.createElement('div'); h.className = 'sec'; h.textContent = q.s; feed.appendChild(h);
      feed.appendChild(document.createElement('br'));
      lastSec = q.s;
    }
    const card = document.createElement('article'); card.className = 'card';
    card.innerHTML = `
      <div class="qmeta"><b>${String(qi+1).padStart(2,'0')} / ${total}</b><span>${esc(q.s||'')}</span></div>
      <p class="qtext" dir="auto">${esc(q.q)}</p>
      <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="bd">${LET[i]}</span><span dir="auto">${esc(t)}</span></button>`).join('')}</div>
      <div class="ex"><div><div class="exb">
        <div class="ans">الإجابة الصحيحة: <span>${LET[q.a]}</span></div>
        <div><span class="lbl">التوضيح:</span> ${esc(q.e)}</div>
      </div></div></div>`;
    card.querySelectorAll('.opt').forEach(btn => btn.onclick = () => choose(card, q, qi, +btn.dataset.i));
    if (ans[qi] != null) paint(card, q, ans[qi]); else if (!firstOpen) firstOpen = card;
    feed.appendChild(card);
  });
  const end = document.createElement('div'); end.className = 'end'; end.id = 'end';
  end.innerHTML = `<h3>the end ✓</h3><p>أنهيت أسئلة هذا المستوى</p>
    <div class="row"><button class="btn dark" id="endBack">العودة</button><button class="btn" id="endReset">إعادة المستوى</button></div>`;
  feed.appendChild(end);
  $('#endBack').onclick = goBack;
  $('#endReset').onclick = () => { if (confirm('هل تريد مسح تقدمك في ' + L.id + ' والبدء من جديد؟')){ delete store.prog[L.id]; save(); renderQuiz(L); window.scrollTo(0,0); } };
  updateBar();
  // resume where the user stopped
  const done = Object.keys(ans).length;
  requestAnimationFrame(() => {
    if (done === 0) return window.scrollTo(0, 0);
    const t = firstOpen || end;
    window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - 70, behavior:'auto' });
  });
}

function choose(card, q, qi, ci){
  const ans = answersOf(cur.id);
  if (ans[qi] != null) return;
  ac();
  ans[qi] = ci; save();
  paint(card, q, ci);
  const ok = ci === q.a, picked = card.querySelectorAll('.opt')[ci];
  picked.classList.add(ok ? 'pop' : 'shake');
  sfx(ok ? 'correct' : 'wrong');
  vib(ok ? [14,45,22] : [38,40,24]);
  updateBar();
}

/* ---------- Router ---------- */
function show(id){
  window.scrollTo(0,0); document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id)); }
function route(force){
  let L = null;
  if (force !== undefined) L = force && LEVELS.find(l => l.id === force);
  else { const m = location.hash.match(/^#\/(L\d+)$/); L = m && LEVELS.find(l => l.id === m[1]); }
  if (L){ show('quiz'); renderQuiz(L); }
  else { cur = null; show('home'); renderHome(); window.scrollTo(0,0); }
}
function go(id){
  try { history.pushState({ app:1 }, '', '#/' + id); } catch(e){}
  route(id);
}
function goBack(){
  try {
    if (history.state && history.state.app){ history.back(); return; }
    history.replaceState(null, '', location.pathname + '#/');
  } catch(e){}
  route(null);
}
$('#back').onclick = goBack;
addEventListener('popstate', () => route());
route();
</script>
